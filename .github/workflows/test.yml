name: Test and build jump counter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run pure counting tests
        run: npm test
      - name: Package web app with local MediaPipe files
        run: npm run build
      - name: Upload runnable web app
        uses: actions/upload-artifact@v4
        with:
          name: jump-rope-web-app
          path: dist/
          retention-days: 14
