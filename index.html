<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>多人跳绳实时计数（测试版）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; }
    #container { position: relative; width: 100%; height: 100%; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas { z-index: 2; }
    #ui {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 16px 12px 28px; display: flex; flex-direction: column; gap: 12px;
    }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button {
      background: #007AFF; color: white; border: none; border-radius: 12px;
      padding: 12px 20px; font-size: 16px; font-weight: 600; min-width: 90px;
    }
    button:active { opacity: 0.7; }
    button.secondary { background: #333; }
    button.danger { background: #FF3B30; }
    #status { text-align: center; font-size: 14px; opacity: 0.9; }
    #person-list {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 80px; overflow-y: auto;
    }
    .person-card {
      background: rgba(255,255,255,0.15); border-radius: 10px; padding: 6px 12px; font-size: 14px;
      min-width: 70px; text-align: center;
    }
    .person-card .id { font-weight: 700; color: #0f0; }
    .person-card .count { font-size: 20px; font-weight: 700; }
    #settings { display: none; background: rgba(0,0,0,0.9); padding: 16px; border-radius: 16px 16px 0 0; }
    label { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
    input[type=range] { width: 140px; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="ui">
      <div id="person-list"></div>
      <div id="status">准备中…</div>
      <div class="row">
        <button id="btn-start">开始</button>
        <button id="btn-pause" class="secondary">暂停</button>
        <button id="btn-reset" class="danger">重置</button>
        <button id="btn-settings" class="secondary">设置</button>
      </div>

      <div id="settings">
        <label>灵敏度（振幅阈值） <span id="amp-val">0.15</span>
          <input type="range" id="amp" min="0.08" max="0.28" step="0.01" value="0.15">
        </label>
        <label>最小间隔(秒) <span id="interval-val">0.32</span>
          <input type="range" id="interval" min="0.20" max="0.60" step="0.02" value="0.32">
        </label>
        <label>最大人数
          <select id="max-poses">
            <option value="4">4</option>
            <option value="6" selected>6</option>
            <option value="8">8</option>
            <option value="10">10</option>
          </select>
        </label>
        <button id="btn-close-settings" style="width:100%;margin-top:8px">关闭</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const personListEl = document.getElementById("person-list");

    let poseLandmarker = null;
    let running = false;
    let lastVideoTime = -1;
    let persons = new Map(); // id -> Person
    let nextId = 1;
    let drawingUtils = null;

    // 可调参数
    let amplitudeRatio = 0.15;
    let minJumpInterval = 0.32;
    let maxPoses = 6;

    class Person {
      constructor(id) {
        this.id = id;
        this.count = 0;
        this.smoothedY = 0;
        this.maxY = 0;
        this.minY = 1;
        this.state = "grounded"; // grounded | rising | peak | falling
        this.lastJumpTime = 0;
        this.lastSeen = performance.now();
        this.color = `hsl(${(id * 67) % 360}, 90%, 60%)`;
      }
    }

    async function init() {
      statusEl.textContent = "加载模型中…";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: maxPoses,
        minPoseDetectionConfidence: 0.5,
        minPosePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      drawingUtils = new DrawingUtils(ctx);

      // 打开后置摄像头
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      statusEl.textContent = "就绪，点击「开始」";
      requestAnimationFrame(loop);
    }

    function matchAndUpdate(detections, now) {
      const centers = detections.map((lm, idx) => {
        const hipL = lm[23], hipR = lm[24];
        const x = (hipL.x + hipR.x) / 2;
        const y = (hipL.y + hipR.y) / 2;
        return { idx, x, y, landmarks: lm };
      });

      // 简单最近邻匹配
      const used = new Set();
      const matched = new Map();

      for (const [id, p] of persons) {
        let best = null, bestDist = 0.18;
        for (const c of centers) {
          if (used.has(c.idx)) continue;
          const dist = Math.hypot(c.x - (p.lastX || c.x), c.y - (p.lastY || c.y));
          if (dist < bestDist) {
            bestDist = dist;
            best = c;
          }
        }
        if (best) {
          used.add(best.idx);
          matched.set(id, best);
          p.lastX = best.x;
          p.lastY = best.y;
          p.lastSeen = now;
        }
      }

      // 更新已匹配的
      for (const [id, det] of matched) {
        updatePerson(persons.get(id), det.landmarks, now);
      }

      // 新出现的人
      for (const c of centers) {
        if (used.has(c.idx)) continue;
        const p = new Person(nextId++);
        p.lastX = c.x;
        p.lastY = c.y;
        persons.set(p.id, p);
        updatePerson(p, c.landmarks, now);
      }

      // 清理丢失过久的
      for (const [id, p] of persons) {
        if (now - p.lastSeen > 1500) persons.delete(id);
      }
    }

    function updatePerson(p, landmarks, now) {
      const hipL = landmarks[23], hipR = landmarks[24];
      const shL = landmarks[11], shR = landmarks[12];
      if (hipL.visibility < 0.4 || hipR.visibility < 0.4) return;

      const hipY = (hipL.y + hipR.y) / 2;
      const shoulderY = (shL.y + shR.y) / 2;
      const bodyHeight = Math.abs(shoulderY - hipY) + 0.001;

      // 平滑
      if (p.smoothedY === 0) p.smoothedY = hipY;
      else p.smoothedY = 0.35 * hipY + 0.65 * p.smoothedY;

      const cy = p.smoothedY;
      p.maxY = Math.max(p.maxY, cy);
      p.minY = Math.min(p.minY, cy);
      const amp = p.maxY - p.minY;
      const significant = amp > bodyHeight * amplitudeRatio;

      // 状态机
      if (p.state === "grounded" || p.state === "unknown") {
        if (significant && cy < p.maxY - amp * 0.55) p.state = "rising";
      } else if (p.state === "rising") {
        if (cy <= p.minY + amp * 0.12) p.state = "peak";
      } else if (p.state === "peak") {
        if (cy > p.minY + amp * 0.35) p.state = "falling";
      } else if (p.state === "falling") {
        if (cy >= p.maxY - amp * 0.15) {
          if ((now - p.lastJumpTime) / 1000 >= minJumpInterval) {
            p.count++;
            p.lastJumpTime = now;
          }
          p.maxY = cy;
          p.minY = cy;
          p.state = "grounded";
        }
      }
    }

    function draw(detections) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      if (!detections) return;

      detections.forEach((lm, i) => {
        // 找对应 person
        let p = null;
        for (const person of persons.values()) {
          const hx = (lm[23].x + lm[24].x) / 2;
          const hy = (lm[23].y + lm[24].y) / 2;
          if (Math.hypot(hx - (person.lastX || 0), hy - (person.lastY || 0)) < 0.15) {
            p = person;
            break;
          }
        }
        if (!p) return;

        // 画骨架（可选）
        drawingUtils.drawLandmarks(lm, { color: p.color, lineWidth: 1, radius: 2 });
        drawingUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: p.color, lineWidth: 2 });

        // 编号 + 次数
        const x = lm[0].x * canvas.width;   // 鼻子位置
        const y = lm[0].y * canvas.height - 30;
        ctx.font = "bold 22px sans-serif";
        ctx.fillStyle = p.color;
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 3;
        const text = `#${p.id}  ${p.count}`;
        ctx.strokeText(text, x, y);
        ctx.fillText(text, x, y);
      });
    }

    function updateUI() {
      personListEl.innerHTML = "";
      let total = 0;
      const sorted = [...persons.values()].sort((a, b) => a.id - b.id);
      for (const p of sorted) {
        total += p.count;
        const div = document.createElement("div");
        div.className = "person-card";
        div.innerHTML = `<div class="id">#${p.id}</div><div class="count">${p.count}</div>`;
        personListEl.appendChild(div);
      }
      statusEl.textContent = running
        ? `运行中 | 人数 ${persons.size} | 总次数 ${total}`
        : `已暂停 | 人数 ${persons.size} | 总次数 ${total}`;
    }

    function loop() {
      if (running && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = poseLandmarker.detectForVideo(video, performance.now());
        matchAndUpdate(result.landmarks, performance.now());
        draw(result.landmarks);
        updateUI();
      } else if (!running) {
        // 暂停时也刷新画面
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(loop);
    }

    // 按钮事件
    document.getElementById("btn-start").onclick = () => { running = true; statusEl.textContent = "运行中"; };
    document.getElementById("btn-pause").onclick = () => { running = false; };
    document.getElementById("btn-reset").onclick = () => {
      for (const p of persons.values()) p.count = 0;
      updateUI();
    };
    document.getElementById("btn-settings").onclick = () => {
      document.getElementById("settings").style.display = "block";
    };
    document.getElementById("btn-close-settings").onclick = () => {
      document.getElementById("settings").style.display = "none";
    };

    document.getElementById("amp").oninput = (e) => {
      amplitudeRatio = parseFloat(e.target.value);
      document.getElementById("amp-val").textContent = amplitudeRatio.toFixed(2);
    };
    document.getElementById("interval").oninput = (e) => {
      minJumpInterval = parseFloat(e.target.value);
      document.getElementById("interval-val").textContent = minJumpInterval.toFixed(2);
    };
    document.getElementById("max-poses").onchange = async (e) => {
      maxPoses = parseInt(e.target.value);
      // 重新创建（简化处理：提示刷新）
      alert("修改最大人数后请刷新页面重新加载模型");
    };

    init().catch(err => {
      statusEl.textContent = "初始化失败: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
