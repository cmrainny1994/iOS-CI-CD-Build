<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081421">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="单部 iPhone 多人跳绳训练辅助计数与成绩复核工具">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>跳绳多人成绩助手 · V0.3</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><span class="eyebrow">训练计数 · V0.3 测试版</span><h1>多人跳绳助手</h1></div>
      <div class="top-actions"><span class="local-pill">本机处理 · 不上传视频</span><button id="btn-history" class="subtle" type="button">历史成绩</button></div>
    </header>

    <section class="video-stage" aria-label="摄像头和识别结果">
      <video id="camera" autoplay muted playsinline></video>
      <canvas id="overlay" aria-label="人员骨架与站位分区"></canvas>
      <div class="stage-message" id="stage-message">请将 iPhone 横放，确保学生全身入镜<br>点击下方「打开摄像头」开始</div>
      <div class="stage-stats">
        <span>检测到 <strong id="detected">0</strong> 人</span>
        <span>识别 <strong id="fps">0</strong> FPS</span>
        <span id="perf-warning" class="warning" hidden>帧率偏低，快跳可能漏计</span>
      </div>
      <div class="timer-box"><span>训练计时</span><strong id="timer">00:00.0</strong></div>
    </section>

    <section class="control-panel">
      <div class="toolbar">
        <button id="btn-camera" class="primary" type="button">打开摄像头</button>
        <button id="btn-start" class="primary" type="button" disabled>开始计数</button>
        <button id="btn-pause" type="button" disabled>暂停</button>
        <button id="btn-save" type="button" disabled>保存成绩</button>
        <button id="btn-reset" class="danger" type="button">重置</button>
      </div>
      <p id="status" class="status" role="status">等待打开摄像头；需要 HTTPS 和摄像头权限。</p>

      <div class="setup-row">
        <label>站位人数 <select id="lane-count">
          <option value="1">1 人</option><option value="2">2 人</option><option value="4" selected>4 人</option>
          <option value="6">6 人</option><option value="8">8 人</option><option value="10">10 人</option>
        </select></label>
        <label>训练时长 <select id="duration">
          <option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="0">不限时</option>
        </select></label>
        <label>起跳阈值 <select id="sensitivity">
          <option value="0.07">灵敏</option><option value="0.1" selected>标准</option><option value="0.15">稳健</option>
        </select></label>
        <label>最短间隔 <select id="interval">
          <option value="0.18">0.18s</option><option value="0.22" selected>0.22s</option><option value="0.28">0.28s</option>
        </select></label>
        <button id="btn-export" type="button" class="subtle">导出 CSV</button>
      </div>

      <div class="results-heading"><h2>各站位实时次数</h2><span>按场地从左到右编号 · 可手动修正</span></div>
      <div id="lane-cards" class="lane-cards"></div>
      <p class="hint">提示：每条竖线是一名学生的固定站位，学生不要交叉换位；识别人数少于站位人数时请调整距离、光线和镜头角度。训练成绩需与电子跳绳复核。</p>
    </section>
  </main>

  <dialog id="history-dialog">
    <div class="dialog-top"><h2>历史成绩（只存本机）</h2><button id="btn-close-history" type="button">关闭</button></div>
    <div id="history-list"></div>
    <p class="hint">清除 Safari 网站数据会同时清除记录。建议及时导出 CSV 留档。</p>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
